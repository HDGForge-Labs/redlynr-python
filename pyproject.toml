[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redlynr"
version = "0.1.1"
description = "Official Python SDK for the Redlynr agent guardrail service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

authors = [
    { name = "HD Gregory LLC", email = "info@hdgregory.com" }
]

keywords = [
    "ai", "agents", "guardrails", "llm", "safety",
    "cost-control", "redlynr", "hdgforge"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://redlynr.com"
Documentation = "https://redlynr.com/readme"
Repository = "https://github.com/HDGForge-Labs/redlynr-python"
"Bug Tracker" = "https://github.com/HDGForge-Labs/redlynr-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["redlynr*"]
